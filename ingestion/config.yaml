# Ingestion & Generator Configuration
#
# Credentials below are local development defaults only. Every one of them is
# overridden by the matching environment variable (see .env.example), and the
# MSSQL password has no value here at all -- MSSQL_PASSWORD must be set in the
# environment. A production deployment would source these from a secrets
# manager injected by the orchestrator.

seed: 42  # RNG seed; the same seed reproduces byte-identical bronze files

scale:
  num_customers: 250
  num_products: 60
  num_orders: 1200
  max_items_per_order: 4
  num_sessions: 2000
  customer_updates_pct: 0.20 # 20% of customers have updated address/state to test SCD Type 2

date_range:
  start_date: "2024-01-01"
  end_date: "2024-12-31"

storage:
  mode: "filesystem" # options: "filesystem", "minio"
  local_bronze_dir: "data/bronze"
  minio:
    endpoint: "localhost:9000"
    docker_endpoint: "http://minio:9000"
    bucket: "bronze"
    access_key: "minioadmin"
    secret_key: "minioadmin"

database:
  host: "localhost"
  docker_host: "postgres"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "warehouse"
  raw_schema: "raw"

mssql:
  server: "localhost"
  docker_server: "mssql"
  port: 1433
  user: "sa"
  # password: intentionally absent -- supplied via the MSSQL_PASSWORD env var.
  database: "warehouse"
  raw_schema: "raw"
